<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altitude Built | Coming Soon</title>
    
    <!-- Das Icon für den Browser-Tab -->
    <link rel="icon" type="image/png" href="Altitude-Built_Zeichen_512.png">

    <style>
        /* Dunkles Theme, passend zu den Farben deiner Grafiken */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0b111e; /* Dunkelblauer Hintergrund */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Der Bereich für dein Hauptbild */
        .header-image-container {
            width: 100%;
            background-color: #000000;
            text-align: center;
        }

        .header-image-container img {
            width: 100%;
            max-width: 1400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Der Textbereich in der Mitte */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }

        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Der Fußzeilenbereich für rechtliches */
        .footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Kopfzeile mit deinem topografischen Bild inkl. Logo -->
    <div class="header-image-container">
        <img src="Kopfzeile_1_Hoehenlinien.jpg" alt="Altitude Built Logo und Hintergrund">
    </div>

    <!-- Hauptinhalt -->
    <div class="content">
        <h1>COMING SOON</h1>
        <p>Wir arbeiten aktuell im Hintergrund an neuen, extrem nutzerfreundlichen Android-Apps. Schau bald wieder vorbei!</p>
    </div>

    <!-- Footer mit Platzhaltern für später -->
    <div class="footer">
        <p>&copy; 2026 Altitude Built. Alle Rechte vorbehalten.</p>
        <a href="#">Impressum</a>
        <a href="#">Datenschutzerklärung</a>
    </div>

</body>
</html>
