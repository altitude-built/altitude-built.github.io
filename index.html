<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altitude Built</title>
    
    <link rel="icon" type="image/png" href="Altitude-Built_Zeichen_512.png">

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #050810;
            --text-muted: #8b949e;
            --text-glow: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Zwingt alles auf 100% Bildschirmgröße */
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-glow);
        }

        /* --- 1. Ambient Aurora Hintergrund --- */
        .aurora-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none; /* Maus-Events scheinen hier durch */
        }

        .aurora-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
        }

        /* Die drei Lichtkugeln */
        .orb-1 {
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: #0f4c75; /* Ein leuchtendes Blau */
            animation-delay: 0s;
        }

        .orb-2 {
            bottom: -20%; right: -10%;
            width: 60vw; height: 60vw;
            background: #1e1b4b; /* Dunkles Indigo/Lila */
            animation-duration: 25s;
        }

        .orb-3 {
            top: 40%; left: 60%;
            width: 40vw; height: 40vw;
            background: #0a2a5c; /* Tiefes Marineblau */
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5vw, -5vh) scale(1.1); }
            66% { transform: translate(-5vw, 10vh) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Vignette für Tiefe */
        .glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(5, 8, 16, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* --- 2. Die 3D Bühne --- */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            perspective: 1200px; /* WICHTIG: Erzeugt die räumliche Tiefe für den Tilt */
        }

        /* Der Container, der tatsächlich rotiert wird */
        .tilt-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d; /* Lässt Kind-Elemente im 3D-Raum schweben */
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            padding: 4rem;
        }

        /* Layer 1: Das Logo (schwebt leicht über dem Text) */
        #logo {
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
            transform: translateZ(50px); 
        }

        /* --- 3. Animierter Text --- */
        .coming-soon {
            font-weight: 300;
            font-size: 1.5rem;
            letter-spacing: 14px;
            text-transform: uppercase;
            margin-right: -14px; 
            margin-bottom: 1rem;
            transform: translateZ(30px); /* Schwebt in der Mitte */
            
            /* Shine / Sweep Effekt */
            background: linear-gradient(
                to right, 
                #4b5563 0%, 
                #ffffff 50%, 
                #4b5563 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            font-weight: 200;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--text-muted);
            transform: translateZ(10px); /* Schwebt ganz nah am Hintergrund */
        }

        /* --- 4. Minimalistischer Footer --- */
        .footer {
            position: absolute;
            bottom: 2.5rem;
            width: 100%;
            text-align: center;
            z-index: 20;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 1.5rem;
            transition: all 0.4s ease;
            position: relative;
        }

        .footer a:hover {
            color: var(--text-glow);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* Responsives Design */
        @media (max-width: 768px) {
            .coming-soon { font-size: 1.1rem; letter-spacing: 10px; margin-right: -10px; }
            .subtitle { font-size: 0.7rem; letter-spacing: 2px; }
            .tilt-wrapper { padding: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Die schwebenden Farben -->
    <div class="aurora-container">
        <div class="aurora-orb orb-1"></div>
        <div class="aurora-orb orb-2"></div>
        <div class="aurora-orb orb-3"></div>
    </div>
    <div class="glass-overlay"></div>

    <!-- Die 3D Leinwand, die auf die Maus reagiert -->
    <div class="scene" id="scene">
        <div class="tilt-wrapper" id="tilt-wrapper">
            <!-- Dein exaktes Bild-Tag -->
            <img src="Altitude-Built_Wortmarke_dunkel.png" alt="Altitude Built" id="logo" style="max-width: 450px; width: 100%; z-index: 10; margin-bottom: 2rem;">
            
            <div class="coming-soon">Coming Soon</div>
            <div class="subtitle">NEW ANDROID EXPERIENCES</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">Impressum</a>
        <a href="#">Datenschutz</a>
    </div>

    <!-- === DER WOW EFFEKT (JavaScript) === -->
    <script>
        const scene = document.getElementById('scene');
        const tiltWrapper = document.getElementById('tilt-wrapper');

        // Wie stark soll sich das Logo maximal neigen? (In Grad)
        const maxTilt = 12; 

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            
            // Maus-Position relativ zur Bildschirmmitte berechnen
            const xPos = e.clientX - rect.left;
            const yPos = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Prozentuale Abweichung von der Mitte berechnen (-1 bis 1)
            const percentX = (xPos - centerX) / centerX;
            const percentY = (yPos - centerY) / centerY;
            
            // Rotation errechnen (Y wird invertiert für ein natürliches Gefühl)
            const rotateX = maxTilt * -percentY;
            const rotateY = maxTilt * percentX;
            
            // CSS Transform anwenden
            tiltWrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Wenn die Maus den Bildschirm verlässt: Sanft in die Mitte zurückgleiten
        scene.addEventListener('mouseleave', () => {
            tiltWrapper.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            tiltWrapper.style.transform = `rotateX(0deg) rotateY(0deg)`;
            
            // Den "weichen" Übergang nach Abschluss wieder entfernen, damit es beim Bewegen wieder snappy ist
            setTimeout(() => {
                tiltWrapper.style.transition = 'transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            }, 600);
        });
        
        // BONUS: Gyroskop-Unterstützung für Handys (Die Seite neigt sich, wenn du das Handy kippst)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                let tiltX = e.beta;  // Vor/Zurück
                let tiltY = e.gamma; // Links/Rechts
                
                // Werte begrenzen, damit es sich nicht überschlägt
                if (tiltX > 45) tiltX = 45;
                if (tiltX < -45) tiltX = -45;
                if (tiltY > 45) tiltY = 45;
                if (tiltY < -45) tiltY = -45;
                
                const rotateX = (tiltX / 45) * maxTilt;
                const rotateY = (tiltY / 45) * maxTilt;
                
                tiltWrapper.style.transform = `rotateX(${-rotateX}deg) rotateY(${rotateY}deg)`;
            });
        }
    </script>
</body>
</html>
