<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altitude Built</title>
    
    <!-- Das Icon für den Browser-Tab -->
    <link rel="icon" type="image/png" href="Altitude-Built_Zeichen_512.png">

    <!-- Google Fonts: Montserrat für einen sehr eleganten, modernen Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        /* Farbpalette: Sehr dunkles, elegantes Blaugrau */
        :root {
            --bg-center: #161b22;
            --bg-edge: #0d1117;
            --text-main: #8b949e;
            --text-hover: #c9d1d9;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%; /* Zwingt die Seite auf exakt 100% Bildschirmhöhe */
            overflow: hidden; /* Verhindert jegliches Scrollen */
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-edge);
            /* Ein sanfter, radialer Verlauf bringt Tiefe ohne aufdringlich zu sein */
            background-image: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%);
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        /* Der Hauptcontainer, der alles exakt in der Mitte hält */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 2s ease-out; /* Weiches Einblenden beim Laden */
        }

        /* Das Logo passt sich dynamisch an, wird aber nie zu riesig */
        .logo {
            width: 100%;
            max-width: 480px; 
            height: auto;
            margin-bottom: 2.5rem;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        /* Minimalistischer Text mit viel Laufweite (Letter-Spacing) */
        .coming-soon {
            font-weight: 200;
            font-size: 1.1rem;
            letter-spacing: 14px;
            text-transform: uppercase;
            margin-right: -14px; /* Optischer Ausgleich für das Letter-Spacing */
            margin-bottom: 0.5rem;
            color: var(--text-hover);
        }

        .subtitle {
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* Footer fest am unteren Bildschirmrand verankert */
        .footer {
            position: absolute;
            bottom: 2.5rem;
            width: 100%;
            text-align: center;
            animation: fadeIn 3s ease-out;
        }

        .footer a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 1.5rem;
            transition: color 0.4s ease;
        }

        .footer a:hover {
            color: var(--text-hover);
        }

        /* Die Fade-In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dynamische Anpassung für Smartphones */
        @media (max-width: 600px) {
            .logo { max-width: 280px; }
            .coming-soon { font-size: 0.9rem; letter-spacing: 10px; margin-right: -10px; }
            .footer { bottom: 1.5rem; }
            .footer a { margin: 0 0.8rem; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Wir nutzen hier die transparente Wortmarke -->
        <img src="Altitude-Built_Wortmarke_hell.png" alt="Altitude Built" class="logo">
        <div class="coming-soon">Coming Soon</div>
        <div class="subtitle">NEW ANDROID EXPERIENCES</div>
    </div>

    <!-- Minimalistische Footer-Links -->
    <div class="footer">
        <a href="#">Impressum</a>
        <a href="#">Datenschutz</a>
    </div>

</body>
</html>
